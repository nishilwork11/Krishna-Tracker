name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check tag matches package.json version
        shell: bash
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "v${v}" ] || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${v}"; exit 1; }
      - run: npm ci
      - run: npm run dist
        env:
          # Optional code signing; leave the secrets unset to build an unsigned installer.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      - uses: softprops/action-gh-release@v2
        with:
          # The small web-installer stub plus the .nsis.7z application package it
          # downloads during install. Both must live in the same release: the stub
          # has the package's versioned URL baked in. electron-builder writes
          # nsis-web output to the dist/nsis-web/ subdirectory.
          files: |
            dist/nsis-web/HRMS-Desktop-Tracker-Setup.exe
            dist/nsis-web/*.nsis.7z
          fail_on_unmatched_files: true
          generate_release_notes: true
